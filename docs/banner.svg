<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Edge traffic-sign classifier banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a49"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- faint grid, like a pixel / feature-map grid -->
  <g stroke="#94a3b8" stroke-opacity="0.08">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200"/>
    <path d="M60 0V320M120 0V320M180 0V320M240 0V320M300 0V320M360 0V320M420 0V320M480 0V320M540 0V320M600 0V320M660 0V320M720 0V320M780 0V320M840 0V320M900 0V320M960 0V320M1020 0V320M1080 0V320M1140 0V320"/>
  </g>

  <!-- moving scan beam -->
  <rect x="-200" y="0" width="200" height="320" fill="url(#scan)">
    <animate attributeName="x" from="-200" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="125" font-size="50" font-weight="700" fill="url(#title)">Edge Traffic-Sign Classifier
    </text>
    <text x="62" y="170" font-size="24" fill="#cbd5e1">Resource-constrained CNNs on GTSRB at 64x64
    </text>
    <text x="62" y="212" font-size="20" fill="#7dd3fc" letter-spacing="1">66,827 PARAMETERS  |  98.64% TEST ACCURACY  |  ~65 KB INT8
    </text>
    <text x="62" y="262" font-size="18" fill="#94a3b8">EN3150 Assignment 03  -  Group Overfitting  -  University of Moratuwa</text>
  </g>

  <!-- floating traffic signs -->
  <!-- warning triangle -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="3.4s" repeatCount="indefinite"/>
    <polygon points="900,70 960,175 840,175" fill="#ffffff" stroke="#dc2626" stroke-width="10" stroke-linejoin="round"/>
    <rect x="896" y="105" width="8" height="38" rx="3" fill="#111827"/>
    <circle cx="900" cy="158" r="5" fill="#111827"/>
  </g>
  <!-- speed limit -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="1030" cy="150" r="52" fill="#ffffff" stroke="#dc2626" stroke-width="12"/>
    <text x="1030" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#111827">50</text>
  </g>
  <!-- stop sign -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.9s" repeatCount="indefinite"/>
    <polygon points="1118,205 1142,205 1160,223 1160,247 1142,265 1118,265 1100,247 1100,223" fill="#dc2626" stroke="#ffffff" stroke-width="4"/>
    <text x="1130" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">STOP</text>
  </g>
  <!-- direction sign -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="3.1s" repeatCount="indefinite"/>
    <circle cx="930" cy="250" r="34" fill="#1d4ed8" stroke="#ffffff" stroke-width="4"/>
    <path d="M915 250H942M934 238L946 250L934 262" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pulsing status dots -->
  <g fill="#38bdf8">
    <circle cx="62" cy="292" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="82" cy="292" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="102" cy="292" r="5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
